name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]
    paths:
      - 'django_app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# 和 django_app/deploy.ps1 做一樣的事：設定取自 deploy_env.txt，金鑰沿用 Secret Manager
env:
  PROJECT: ntub-90ecf
  REGION: asia-east1
  SERVICE: ntub-course

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT }}

      - name: Build and deploy to Cloud Run
        working-directory: django_app
        run: |
          # deploy_env.txt → YAML（去掉 BOM 與空值）
          sed '1s/^\xEF\xBB\xBF//' deploy_env.txt | tr -d '\r' \
            | awk -F= '/^[A-Z_]+=/{k=$1; sub(/^[^=]*=/,""); if($0!="") {gsub(/\x27/,"\x27\x27"); print k": \x27"$0"\x27"}}' \
            > "$RUNNER_TEMP/env.yaml"

          SECRETS="DJANGO_SECRET_KEY=django-secret-key:latest"
          if gcloud secrets describe openai-api-key --project "$PROJECT" >/dev/null 2>&1; then
            SECRETS="$SECRETS,OPENAI_API_KEY=openai-api-key:latest"
          fi

          gcloud run deploy "$SERVICE" --source . \
            --region "$REGION" --project "$PROJECT" \
            --allow-unauthenticated --max-instances 3 \
            --env-vars-file "$RUNNER_TEMP/env.yaml" \
            --set-secrets "$SECRETS"

      - name: Verify deployment
        run: |
          SERVICE_URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(status.url)')
          echo "✓ 部署完成: $SERVICE_URL"
          curl -s -I "$SERVICE_URL" | head -5
