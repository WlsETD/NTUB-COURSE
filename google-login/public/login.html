<meta name="theme-color" content="#0e6b75">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="initGoogle()"></script>
<style>
:root{--bg:#f3f5f7;--surface:#fff;--surface-2:#eaeef2;--fg:#18222d;--muted:#5d6b7a;--accent:#0e6b75;--accent-soft:#d8eef0;--bad:#b3382c;--bad-soft:#f8dedb;
  --t1:#1a73e8;--t2:#d93025;--t3:#f9ab00;--t4:#188038;--t5:#0e6b75;--t6:#6741d9}
@media (prefers-color-scheme:dark){:root{--bg:#0f161d;--surface:#17212b;--surface-2:#1f2b37;--fg:#e7edf3;--muted:#93a3b3;--accent:#4cc0cc;--accent-soft:#17383d;--bad:#ff8c80;--bad-soft:#42201c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;display:grid;place-items:center;padding:24px 16px}
.stage{width:min(440px,100%);display:flex;flex-direction:column;align-items:center;gap:22px}
.intro{display:flex;flex-direction:column;align-items:center;gap:10px;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
body.login .intro{transform:translateY(-6px) scale(.72)}
.tiles{display:grid;grid-template-columns:repeat(3,26px);grid-template-rows:repeat(2,20px);gap:5px;margin-bottom:10px}
.tiles i{border-radius:5px;opacity:0;animation:tile .5s cubic-bezier(.2,.9,.3,1.3) both}
.tiles i:nth-child(1){background:var(--t1);animation-delay:.05s}.tiles i:nth-child(2){background:var(--t2);animation-delay:.15s}.tiles i:nth-child(3){background:var(--t3);animation-delay:.25s}
.tiles i:nth-child(4){background:var(--t4);animation-delay:.35s}.tiles i:nth-child(5){background:var(--t5);animation-delay:.45s}.tiles i:nth-child(6){background:var(--t6);animation-delay:.55s}
@keyframes tile{from{opacity:0;transform:translateY(14px) scale(.4)}to{opacity:1;transform:none}}
h1{margin:0;font-size:clamp(40px,11vw,64px);font-weight:900;letter-spacing:.08em;line-height:1.1}
h1 span{display:inline-block;opacity:0;animation:char .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes char{from{opacity:0;transform:translateY(28px);filter:blur(8px)}60%{filter:blur(0)}to{opacity:1;transform:none;filter:none}}
.sub{margin:0;color:var(--muted);font-size:14px;text-align:center;opacity:0;animation:fade .6s 1.3s both}
.line{height:3px;width:160px;border-radius:9px;background:var(--accent);transform-origin:left;transform:scaleX(0);animation:line 1s 1.5s cubic-bezier(.6,0,.2,1) both}
body.login .line{opacity:0;transition:opacity .3s}
@keyframes line{to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{width:100%;background:var(--surface);border-radius:20px;box-shadow:0 16px 48px rgba(10,20,30,.14);padding:28px 24px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;animation:card .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes card{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.card h2{margin:4px 0 0;font-size:20px}
.desc{margin:0;color:var(--muted);font-size:14px}
#gbtn{min-height:44px;margin-top:6px;display:flex;justify-content:center}
.msg{width:100%;font-size:13px;background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;text-align:left}
.note{margin:0;font-size:12px;color:var(--muted)}
.skip{position:fixed;right:20px;bottom:20px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}h1 span,.sub,.tiles i{opacity:1}.line{transform:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="intro">
    <div class="tiles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <h1 id="title" aria-label="選課系統"></h1>
    <p class="sub">國立臺北商業大學 · 115-1 四技日間部</p>
    <span class="line" aria-hidden="true"></span>
  </div>
  <div class="card" id="card" hidden>
    <h2>登入選課系統</h2>
    <p class="desc">使用學校 Google 帳號（@ntub.edu.tw）登入，不需要另外註冊。</p>
    <div id="gbtn"></div>
    <div class="msg" id="msg" role="alert" hidden></div>
    <p class="note">只接受 @ntub.edu.tw 學校帳號，個人 Gmail 無法登入。</p>
  </div>
</div>
<button class="skip" id="skip" type="button">略過動畫</button>
<script>
  // 片頭：逐字出現的標題，2.6 秒後切到登入卡片
  document.getElementById("title").innerHTML = "選課系統".split("").map(function (ch, i) {
    return '<span style="animation-delay:' + (500 + i * 90) + 'ms" aria-hidden="true">' + ch + "</span>";
  }).join("");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function showLogin() {
    if (document.body.classList.contains("login")) return;
    document.body.classList.add("login");
    document.getElementById("card").hidden = false;
    document.getElementById("skip").hidden = true;
  }
  setTimeout(showLogin, reduce ? 0 : 2600);
  document.getElementById("skip").onclick = showLogin;

  // Google Identity Services：hd 只是提示 Google 優先顯示學校帳號，真正的網域檢查在伺服器
  function initGoogle() {
    google.accounts.id.initialize({
      client_id: window.GOOGLE_CLIENT_ID,
      callback: onCredential,
      hd: "ntub.edu.tw",
      ux_mode: "popup",
      auto_select: false,
      cancel_on_tap_outside: true
    });
    google.accounts.id.renderButton(document.getElementById("gbtn"), {
      theme: "outline", size: "large", shape: "pill", text: "signin_with", locale: "zh-TW", width: 300
    });
  }
  function showError(text) {
    var m = document.getElementById("msg");
    m.textContent = text;
    m.hidden = false;
  }
  async function onCredential(resp) {
    try {
      var r = await fetch("/auth/google", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ credential: resp.credential })
      });
      if (r.ok) { location.href = "/app"; return; }
      var data = await r.json().catch(function () { return {}; });
      if (r.status === 403) showError("你登入的是 " + (data.email || "非學校帳號") + "，請改用 @ntub.edu.tw 學校帳號登入。");
      else showError("登入驗證失敗，請重新整理後再試一次。");
    } catch (e) {
      showError("無法連線到伺服器，請檢查網路後再試。");
    }
  }
</script>
</body>
</html>
